<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ticaret Sitesi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">🛍️ TechStore</div>
            <nav class="navbar">
                <a href="#home">Ana Sayfa</a>
                <a href="#products">Ürünler</a>
                <a href="#cart" class="cart-link">🛒 Sepet <span class="cart-count">0</span></a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-content">
            <h1>Hoşgeldiniz TechStore'a</h1>
            <p>En iyi teknoloji ürünleri burada!</p>
            <button class="btn-primary" onclick="scrollToProducts()">Alışverişe Başla</button>
        </div>
    </section>

    <!-- Products Section -->
    <section class="products" id="products">
        <div class="container">
            <h2>Ürünlerimiz</h2>
            <div class="products-grid" id="productsGrid">
                <!-- Ürünler JS tarafından yüklenecek -->
            </div>
        </div>
    </section>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2>Alışveriş Sepeti</h2>
            <div class="cart-items" id="cartItems">
                <!-- Sepet öğeleri buraya yüklenecek -->
            </div>
            <div class="cart-summary">
                <h3>Toplam: ₺<span id="totalPrice">0</span></h3>
                <button class="btn-primary" onclick="checkout()">Ödemeye Devam Et</button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content checkout-form">
            <span class="close" onclick="closeCheckout()">&times;</span>
            <h2>Ödeme İşlemi</h2>
            <form onsubmit="completeOrder(event)">
                <div class="form-group">
                    <label>Ad Soyad</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Adres</label>
                    <textarea required></textarea>
                </div>
                <div class="form-group">
                    <label>Kart Numarası</label>
                    <input type="text" placeholder="1234 5678 9012 3456" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Expiry</label>
                        <input type="text" placeholder="MM/YY" required>
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="text" placeholder="123" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Siparişi Tamamla</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
